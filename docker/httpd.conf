# SvnGo Apache HTTP Server configuration.
# Runs as the unprivileged container user; values come from environment
# variables set by the SvnGo supervisor (svngo serve).

Define MODDIR /usr/lib/apache2

LoadModule mpm_event_module     ${MODDIR}/mod_mpm_event.so
LoadModule unixd_module         ${MODDIR}/mod_unixd.so
LoadModule authn_core_module    ${MODDIR}/mod_authn_core.so
LoadModule authn_file_module    ${MODDIR}/mod_authn_file.so
LoadModule authz_core_module    ${MODDIR}/mod_authz_core.so
LoadModule authz_user_module    ${MODDIR}/mod_authz_user.so
LoadModule auth_basic_module    ${MODDIR}/mod_auth_basic.so
LoadModule log_config_module    ${MODDIR}/mod_log_config.so
LoadModule headers_module       ${MODDIR}/mod_headers.so
LoadModule alias_module         ${MODDIR}/mod_alias.so
LoadModule rewrite_module       ${MODDIR}/mod_rewrite.so
LoadModule reqtimeout_module    ${MODDIR}/mod_reqtimeout.so
LoadModule proxy_module         ${MODDIR}/mod_proxy.so
LoadModule proxy_http_module    ${MODDIR}/mod_proxy_http.so
LoadModule dav_module           ${MODDIR}/mod_dav.so
LoadModule dav_svn_module       ${MODDIR}/mod_dav_svn.so
LoadModule authz_svn_module     ${MODDIR}/mod_authz_svn.so
<IfDefine SVNGO_TLS>
LoadModule socache_shmcb_module ${MODDIR}/mod_socache_shmcb.so
LoadModule ssl_module           ${MODDIR}/mod_ssl.so
</IfDefine>

ServerName ${SVNGO_SERVER_NAME}
ServerRoot /var/www
DocumentRoot /var/empty
Listen ${SVNGO_HTTP_PORT}
PidFile ${SVNGO_RUN_DIR}/httpd.pid
DefaultRuntimeDir ${SVNGO_RUN_DIR}

ErrorLog /dev/stderr
LogLevel warn
LogFormat "%a %u [%{%Y-%m-%d %H:%M:%S}t] \"%r\" %>s %B %{ms}Tms" svngo
CustomLog /dev/stdout svngo "expr=%{REQUEST_URI} != '/admin/healthz'"
# failed SVN logins (credentials sent but rejected) -> SvnGo brute-force guard;
# every path except /admin is an SVN path (/svn and the generated locations)
LogFormat "svngo-authfail %a" svngo_authfail
CustomLog /dev/stdout svngo_authfail "expr=%{REQUEST_STATUS} == 401 && -n %{REMOTE_USER} && %{REQUEST_URI} !~ m#^/admin(/|$)#"

ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
Timeout 300
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 5
# small default; /svn and /admin set their own limits below
LimitRequestBody 1048576
LimitXMLRequestBody 1000000
RequestReadTimeout header=20-40,MinRate=500 body=60,MinRate=500
GracefulShutdownTimeout 10

# small footprint: 1 process to start, grows on demand
StartServers 1
ServerLimit 4
ThreadsPerChild 25
MaxRequestWorkers 100
MinSpareThreads 10
MaxSpareThreads 50
MaxConnectionsPerChild 0

<Directory />
    AllowOverride None
    Options None
    Require all denied
</Directory>

<Location />
    Require all denied
</Location>

RedirectMatch 302 ^/$ /admin/

# Clients blocked by the SvnGo brute-force guard get 429 in the translate
# phase, before authentication. mod_rewrite re-reads the map on mtime change.
RewriteEngine On
RewriteMap svnblock "txt:${SVNGO_SVN_BLOCK_MAP}"
RewriteCond "${svnblock:%{REMOTE_ADDR}|0}" "!=0"
RewriteRule "^/(?!admin(?:/|$))." - [R=429,L]
Header always set Retry-After "60" "expr=%{REQUEST_STATUS} == 429"
# SVN client IP allow list (generated by SvnGo, 403 before authentication);
# changes are applied with a graceful restart.
Include ${SVNGO_SVN_ACCESS_CONF}

RequestHeader set X-Forwarded-Proto "https" "expr=%{HTTPS} == 'on'"
# the admin backend sets its own security headers; replace instead of duplicating
Header onsuccess unset X-Content-Type-Options
Header always set X-Content-Type-Options "nosniff"

# ---- Subversion over HTTP(S): /svn/<repository> ----
# Keep these directives in sync with LocationsConf (internal/apache/locations.go).
<Location /svn>
    DAV svn
    SVNParentPath ${SVNGO_REPOS_DIR}
    SVNListParentPath Off
    SVNPathAuthz short_circuit
    SVNAllowBulkUpdates Prefer
    SVNCacheTextDeltas On
    SVNCacheFullTexts On

    AuthType Basic
    AuthName "SvnGo Subversion"
    AuthBasicProvider file
    AuthUserFile ${SVNGO_CONFIG_DIR}/htpasswd
    AuthzSVNAccessFile ${SVNGO_CONFIG_DIR}/authz
    Require valid-user

    # per request (a commit sends one PUT per file); 0 = unlimited
    LimitRequestBody ${SVNGO_SVN_MAX_BODY}
    LimitXMLRequestBody ${SVNGO_SVN_MAX_XML}
</Location>

# ---- SVN locations: /<location>/<repository> (generated by SvnGo) ----
Include ${SVNGO_SVN_LOCATIONS_CONF}

# ---- Web admin UI (Go server on loopback) ----
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 600
<Location /admin>
    Require all granted
    # the Go server enforces per-endpoint limits (forms 2 MB, backup upload streamed)
    LimitRequestBody 0
    ProxyPass http://${SVNGO_ADMIN_BACKEND}/admin retry=0
    ProxyPassReverse http://${SVNGO_ADMIN_BACKEND}/admin
</Location>

# ---- Optional HTTPS (enabled when the certificate files exist) ----
<IfDefine SVNGO_TLS>
Listen ${SVNGO_HTTPS_PORT}
SSLSessionCache "shmcb:${SVNGO_RUN_DIR}/ssl_scache(512000)"
SSLSessionCacheTimeout 300
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLHonorCipherOrder off
SSLSessionTickets off
<VirtualHost _default_:${SVNGO_HTTPS_PORT}>
    SSLEngine on
    RewriteEngine On
    RewriteOptions Inherit
    SSLCertificateFile ${SVNGO_TLS_CERT}
    SSLCertificateKeyFile ${SVNGO_TLS_KEY}
    Header onsuccess unset Strict-Transport-Security
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>
</IfDefine>
