{{define "content"}}
<div class="auth-card">
  <div class="auth-brand">{{template "logo"}}<h1>{{.App}}</h1></div>
  <p class="muted center">{{t "login.subtitle"}}</p>
  {{with .D.Error}}<div class="alert err" role="alert">{{msg .}}</div>{{end}}
  <form method="post" action="/admin/login" class="form" hx-boost="false">
    <input type="hidden" name="_csrf" value="{{.D.CSRF}}">
    <input type="hidden" name="next" value="{{.D.Next}}">
    <label>{{t "common.username"}}<input name="username" value="{{.D.Username}}" autocomplete="username" required autofocus maxlength="64"></label>
    <label>{{t "common.password"}}<input name="password" type="password" autocomplete="current-password" required maxlength="72"></label>
    <button class="btn primary block">{{t "login.submit"}}</button>
  </form>
  <p class="muted small center">{{t "login.hint1"}}<br>{{t "login.hint2"}}</p>
</div>
{{end}}
