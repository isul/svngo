{{define "content"}}
<h1>{{t "nav.perms"}}</h1>
<section class="box">
  <h2>{{t "perms.add_title"}}</h2>
  <form method="post" action="/admin/perms" class="form row-form">
    <input type="hidden" name="_csrf" value="{{.CSRF}}"><input type="hidden" name="back" value="{{.D.Back}}">
    <label>{{t "common.repo"}}<select name="repo" required><option value="">{{t "common.select"}}</option>{{range .D.Repos}}<option value="{{.}}"{{if eq . $.D.Repo}} selected{{end}}>{{.}}</option>{{end}}</select></label>
    <label>{{t "rule.col.path"}}<input name="path" value="/" required maxlength="1024"></label>
    <label>{{t "rule.col.subject"}}<select name="subject" required><option value="">{{t "common.select"}}</option>{{range .D.Subjects}}<option value="{{.Value}}">{{msg .Label}}</option>{{end}}</select></label>
    <label>{{t "rule.col.access"}}{{template "access_select"}}</label>
    <button class="btn primary">{{t "common.save"}}</button>
  </form>
  <p class="muted small">{{t "perms.hint"}}</p>
</section>

<form class="search row" method="get" action="/admin/perms">
  <select name="repo" aria-label="{{t "perms.repo_filter"}}"><option value="">{{t "perms.all_repos"}}</option>{{range .D.Repos}}<option value="{{.}}"{{if eq . $.D.Repo}} selected{{end}}>{{.}}</option>{{end}}</select>
  <input name="subject" value="{{.D.Subject}}" placeholder="{{t "perms.subject_placeholder"}}" aria-label="{{t "perms.subject_filter"}}">
  <button class="btn">{{t "perms.filter"}}</button>
</form>

<section class="box">
  {{template "rule_table" (dict "Rules" .D.Rules "Back" .D.Back "CSRF" .CSRF "ShowRepo" true)}}
  {{template "pager" .D.Pager}}
</section>
{{end}}
